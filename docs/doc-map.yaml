# Luminous 文档覆盖映射
#
# scripts/check_doc_coverage.dart 读取本文件（唯一事实源）：
# - docs_required：必改文档，全部命中才满足（通常只有迁移日志）
# - docs_any_of：  至少命中其一（按变更性质选择）
# - docs_info：    仅建议，缺失不警告
# - 阻断模式（默认，pre-commit 已实际启用）：有代码变更但无任何 docs/ 文件变更 → exit(1)
# - 警告模式（--warning-only）：打印每条规则的三级报告，不阻断（每日检查保持警告模式）
# - 验证模式（--verify）：校验 doc-map 引用存在、文档链接完整、front-matter 完整、
#   90 天新鲜度（status: frozen 豁免）、活跃文档阅读入口（doc-map 规则或文档链接）、
#   lib/features/* 覆盖完整性；发现问题 → exit(1)
# - 旁路：SKIP_DOC_CHECK=1
#
# glob 规则：* 匹配单层路径，** 匹配多层路径。
# 归档文档（04-archive/）不参与覆盖映射（历史可追溯，不强制同步）。
# 活跃文档 front-matter 中的 status/updated 由 stale 检查消费；status: frozen 豁免新鲜度。
# 每个 lib/features/* 目录都必须被至少一条规则的 code glob 覆盖
# （--verify 校验，豁免列表见 doc_coverage.dart 的 exemptFeaturePatterns）。
# 迁移日志条目约定：描述变更范围与验证结论，不写需要持续同步的精确数字（如测试总数），见 AGENTS.md。

rules:
  # ──────────────────────────────────────────────
  # 工具链与治理
  # ──────────────────────────────────────────────
  - name: docs-tooling
    code:
      - scripts/check_doc_coverage.dart
      - scripts/check_doc_links.dart
      - scripts/doc_coverage.dart
      - scripts/tooling_workflows.dart
      - scripts/tooling_support.dart
      - scripts/git_hook.dart
      - scripts/run_daily_checks.dart
      - scripts/run_fullstack_checks.dart
      - scripts/verify_lucent_openapi_sync.dart
      - .github/workflows/**
      - .github/copilot-instructions.md
      - .cursor/mcp.json
      - .vscode/settings.json
      - .vscode/extensions.json
      - AGENTS.md
      - CLAUDE.md
      - GEMINI.md
      - docs/doc-map.yaml
    docs_required:
      - docs/03-logs/migration-log/*.md
    docs_any_of:
      - docs/02-reference/Project_Guardrails.md
      - docs/02-reference/AI_Development_Workflow.md
      - docs/00-current/Project_Governance.md
    docs_info:
      - docs/00-current/TODO.md

  # ──────────────────────────────────────────────
  # App Shell、路由、桌面外壳
  # ──────────────────────────────────────────────
  - name: app-shell
    code:
      - lib/app/**
      - lib/core/router/**
      - lib/features/shell/**
    docs_required:
      - docs/03-logs/migration-log/*.md
    docs_any_of:
      - docs/02-reference/routing.md
      - docs/02-reference/architecture.md
      - docs/02-reference/adr/0002-gorouter-navigation.md
      - docs/02-reference/adr/0010-type-safe-routing-go-router-builder.md
      - docs/00-current/Active_Mobile_UI.md
      - docs/00-current/Desktop_UI.md
    docs_info:
      - docs/00-current/Runtime_Snapshot.md

  # ──────────────────────────────────────────────
  # Core — 网络层与 API 客户端
  # ──────────────────────────────────────────────
  - name: core-network
    code:
      - lib/core/network/**
      - generated/lucent_api/**
    docs_required:
      - docs/03-logs/migration-log/*.md
    docs_any_of:
      - docs/02-reference/data-layer.md
      - docs/02-reference/OpenApi_Client.md
      - docs/02-reference/adr/0007-network-layer-separation.md
      - docs/00-current/Lucent_Contract_Snapshot.md
    docs_info:
      - docs/00-current/Runtime_Snapshot.md

  # ──────────────────────────────────────────────
  # Core — 设计系统与主题
