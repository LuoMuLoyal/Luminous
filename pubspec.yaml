name: luminous
description: "Health_Assistant_Flutter"
license: MIT
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

fluwx:
  ios:
    scene_delegate: true

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_hooks: ^0.21.3
  hooks_riverpod: ^3.0.0
  go_router: ^17.2.3
  shared_preferences: ^2.5.4
  dio: ^5.9.2
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  connectivity_plus: ^6.1.0
  intl: ^0.20.2
  image_picker: ^1.1.2
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.1
  permission_handler: ^12.0.0
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_secure_storage: ^10.3.1
  collection: ^1.19.1
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  fl_chart: ^1.2.0
  table_calendar: ^3.2.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  lucent_api:
    path: generated/lucent_api
  url_launcher: ^6.3.2
  fluwx: 5.7.5 # pinned: WeChat SDK requires exact version match for native builds
  flutter_markdown_plus: ^1.0.12
  email_validator: ^2.1.17
  mobile_scanner: ^7.2.0
  paddle_ocr_native: ^0.1.1
  health: ^13.3.1

  sign_in_with_apple: ^8.1.0
  flutter_svg: ^2.1.0
  share_plus: ^13.2.0
  forui: ^0.24.1
  forui_hooks: ^0.24.0
  timeline_tile: ^2.0.0
  flutter_slidable: ^4.0.3
  clock: ^1.1.2
  talker_flutter: ^5.1.17
  sentry_flutter: ^9.0.0
  sentry_dio: ^9.0.0
  flutter_image_compress: ^2.4.0
  riverpod_annotation: ^4.0.3
  window_manager: ^0.4.3
  package_info_plus: ^10.2.0
  elk_icon_picker: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  build_runner: ^2.15.0
  json_serializable: ^6.9.5
  freezed: ^3.2.5
  mocktail: ^1.0.5
  network_image_mock: ^2.1.1

  integration_test:
    sdk: flutter
  riverpod_generator: ^4.0.4
  drift_dev: ^2.20.0
  go_router_builder: ^4.3.0

dependency_overrides:
  # health ^13.x pulls device_info_plus ^12.x which depends on win32 ^5.x,
  # conflicting with package_info_plus ^10.x (win32 ^6.x).
  # device_info_plus 13.x uses win32 ^6.x, resolving the conflict.
  device_info_plus: ^13.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  min_sdk_android: 26
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon.png
  adaptive_icon_foreground_inset: 24
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#FFFFFF"
    theme_color: "#159B55"
  windows:
    generate: true
    image_path: assets/icon/app_icon.png
    icon_size: 48
  macos:
    generate: true
    image_path: assets/icon/app_icon.png

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#171717"
  image: assets/icon/app_icon.png
  android_12:
    image: assets/icon/app_icon_splash.png
    color: "#FFFFFF"
    color_dark: "#171717"
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#171717"
  android: true
  ios: true
  web: true

flutter:
  uses-material-design: false
  generate: true
  assets:
    - assets/
    - assets/icon/app_icon.png
    - assets/icon/oauth/
    - assets/legal/
    - assets/faq/
