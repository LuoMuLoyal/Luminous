name: llama_native
description: "On-device LLM inference for Flutter, backed by llama.cpp through Rust and flutter_rust_bridge."
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # Generated by `flutter_rust_bridge_codegen`; it also carries the runtime that
  # loads the native library, so it is a runtime dependency rather than a dev one.
  flutter_rust_bridge: 2.11.1
  # Supplies the default download directory for the bundled build hook.
  path: ^1.9.1
  # Required by the state classes the code generator emits.
  freezed_annotation: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Required by `flutter_rust_bridge_codegen`.
  freezed: ^3.0.0
  build_runner: ^2.4.0

flutter:
  # The Rust cdylib is built and bundled by the `rust_builder` hook; see the
  # README. Nothing here points at a prebuilt binary: a phone must build the right
  # ABI, and a desktop build the right architecture.
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true