include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Vendored plugin uses generated MethodChannel stubs in tests.
    invalid_annotation_target: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

dart:
  # Generated plugin code uses generated prefixes.
