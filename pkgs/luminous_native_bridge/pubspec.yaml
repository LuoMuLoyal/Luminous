name: luminous_native_bridge
description: "Luminous native bridge channel layer."
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.0.11

flutter:
  plugin:
    platforms:
      android:
        package: com.devluo.luminous.bridge
        pluginClass: LuminousNativeBridgePlugin
      ios:
        pluginClass: LuminousNativeBridgePlugin
