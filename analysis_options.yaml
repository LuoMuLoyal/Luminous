include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # --- 已有的 ---
    - prefer_single_quotes
    - avoid_dynamic_calls
    - require_trailing_commas
    - prefer_const_constructors
    - type_annotate_public_apis

    # --- Bug 预防 ---
    - always_declare_return_types
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - discarded_futures
    - unawaited_futures
    # - only_throw_errors
    - parameter_assignments

    # --- Phase 3B 收紧(doc-governance-overhaul 计划)---
    # 经 flutter_lints include 已隐式生效,显式声明防版本漂移;
    # 基线 0 违规,直接以 error 级启用,豁免须附理由注释。
    - avoid_print
    - use_build_context_synchronously

    # --- 空安全 ---
    # - cast_nullable_to_non_nullable
    # - prefer_null_aware_method_calls

    # --- Flutter 最佳实践 ---
    - use_decorated_box
    # - sized_box_shrink_expand

    # --- 风格 / 可读性 ---
    # - avoid_multiple_declarations_per_line
    # - avoid_positional_boolean_parameters
    # - avoid_redundant_argument_values
    - directives_ordering
    - eol_at_end_of_file
    - prefer_const_declarations
    # - prefer_const_literals_to_create_immutables
    # - prefer_final_in_for_each
    - prefer_final_locals
    - sort_constructors_first

    # --- 文档 ---
    # - flutter_style_todos
    # - deprecated_consistency

analyzer:
  errors:
    # Phase 3B:四条异步/输出纪律规则以 error 级生效(基线 0 违规)
    avoid_print: error
    unawaited_futures: error
    discarded_futures: error
    use_build_context_synchronously: error
  exclude:
    - generated/lucent_api/**
    - scripts/**
    # Independent analyzer plugin package; analyzed via `dart test` in
    # tool/luminous_lints, not with the app's analyzer context.
    - tool/luminous_lints/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
# In-IDE plugin integration is deferred: the app dependency graph pins
# analyzer 12.x (freezed) while the analysis server requires the plugin to
# match its in-process analyzer (14.1.0). The rules run via the CLI driver:
#   cd tool/luminous_lints && dart run bin/luminous_lints.dart
