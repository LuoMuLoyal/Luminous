name: luminous-ci

on:
  workflow_dispatch:
  pull_request:
  push:

concurrency:
  group: luminous-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Flutter CI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Lucent contract source
        uses: actions/checkout@v4
        with:
          repository: LuoMuLoyal/Lucent
          path: Lucent

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Lucent/pnpm-lock.yaml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Install Lucent dependencies
        run: pnpm --dir Lucent install --frozen-lockfile

      - name: Export Lucent OpenAPI
        run: pnpm --dir Lucent export:openapi

      - name: Bootstrap generated sources
        run: dart run tool/bootstrap_generated_sources.dart --openapi "$GITHUB_WORKSPACE/Lucent/docs/openapi.json"

      - name: Analyze
        run: flutter analyze

      - name: Format check
        run: dart format --set-exit-if-changed lib/ test/ tool/

      - name: Run tests
        run: flutter test --coverage

      - name: Verify Lucent OpenAPI contract sync
        run: dart run tool/verify_lucent_openapi_sync.dart --openapi "$GITHUB_WORKSPACE/Lucent/docs/openapi.json"

      - name: Build APK (release)
        run: flutter build apk --release
