name: luminous-cd

on:
  workflow_dispatch:
  push:
    branches: [refactor]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: luminous-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Merge ARB fragments
        run: dart scripts/arb_tools.dart merge

      - name: Bootstrap generated sources
        run: dart run tool/bootstrap_generated_sources.dart --skip-client

      - name: Build generated API client
        run: |
          cd generated/lucent_api
          dart pub get
          dart run build_runner build --delete-conflicting-outputs
          cd ../..

      - name: Compile drift web worker
        run: dart compile js web/drift_worker.dart -o web/drift_worker.js -O4

      - name: Build Web (release)
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
