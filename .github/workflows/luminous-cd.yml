name: luminous-cd

on:
  workflow_dispatch:
  push:
    branches: [refactor]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: luminous-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.LUCENT_BASE_URL }}" ]; then
            echo "::error::Secret LUCENT_BASE_URL is not set. The web build would inject an empty API base URL."
            exit 1
          fi
          # SENTRY_DSN is optional — if unset or empty, the app skips Sentry
          # initialization at runtime (see _initSentry in lib/main.dart).
          if [ -n "${{ secrets.SENTRY_DSN }}" ]; then
            if ! echo "${{ secrets.SENTRY_DSN }}" | grep -qP '^https?://[^/]+@[^/]+/.+'; then
              echo "::error::Secret SENTRY_DSN is set but is not a valid Sentry DSN."
              echo "Expected format: https://<public_key>@<host>/<project_id>"
              echo "To disable Sentry, remove the secret entirely instead of using a placeholder."
              exit 1
            fi
          else
            echo "::warning::SENTRY_DSN is not set — Sentry will be disabled for this build."
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Merge ARB fragments
        run: dart scripts/arb_tools.dart merge

      - name: Bootstrap generated sources
        run: dart run tool/bootstrap_generated_sources.dart --skip-client

      - name: Build generated API client
        run: |
          cd generated/lucent_api
          dart pub get
          dart run build_runner build --delete-conflicting-outputs
          cd ../..

      - name: Compile drift web worker
        run: dart compile js web/drift_worker.dart -o web/drift_worker.js -O4

      - name: Build Web (release) with env
        run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=LUCENT_BASE_URL=${{ secrets.LUCENT_BASE_URL }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --dart-define=LUMINOUS_EXPERIMENTAL_AI_RUNTIME=${{ vars.LUMINOUS_EXPERIMENTAL_AI_RUNTIME || 'false' }} \
            --dart-define=LUMINOUS_AI_RUNTIME_PROVIDER=${{ vars.LUMINOUS_AI_RUNTIME_PROVIDER || 'openai' }} \
            --dart-define=LUMINOUS_ENABLE_GEN_UI=${{ vars.LUMINOUS_ENABLE_GEN_UI || 'false' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
