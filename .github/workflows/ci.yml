name: CI

# 代码门禁：analyze / 单测 / 生成物一致性 / 文档校验。
# Web 发布在 deploy-web.yml。
# 拆分理由见 .github/workflows/README.md。

on:
  workflow_dispatch:
  pull_request:
  push:

concurrency:
  group: luminous-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Flutter CI
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock', '**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Merge ARB fragments
        run: dart scripts/l10n/arb_tools.dart merge

      - name: Bootstrap generated sources
        run: dart run scripts/contract/bootstrap.dart --skip-client

      - name: Build generated API client
        run: |
          cd generated/lucent_api
          dart pub get
          dart run build_runner build --delete-conflicting-outputs
          cd ../..

      - name: Compile drift web worker
        run: dart compile js web/drift_worker.dart -o web/drift_worker.js -O4

      - name: Verify generated docs
        run: dart run scripts/docs/generate.dart --check

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage --reporter=github

  build-apk:
    name: Build APK (release)
    # 只在 main 的 push 上产出安装包；PR / 手动触发不跑，省时间。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock', '**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Bootstrap generated sources
        run: dart run scripts/contract/bootstrap.dart --skip-client

      - name: Compile drift web worker
        run: dart compile js web/drift_worker.dart -o web/drift_worker.js -O4

      - name: Build APK (release)
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --obfuscate \
            --split-debug-info=build/symbols
