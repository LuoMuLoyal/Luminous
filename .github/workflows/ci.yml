name: CI

# 代码门禁：只做校验，不产出任何发布产物。
# ARB 合并 / 生成物准备 / 生成客户端 / 生成文档一致性 / analyze / 全量单测。
# 发布各自独立：deploy-android.yml / deploy-ios.yml / deploy-web.yml。
# 拆分理由见 .github/workflows/README.md。

on:
  workflow_dispatch:
  pull_request:
  push:

concurrency:
  group: luminous-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Flutter CI
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock', '**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      # native/ 是独立 Gradle build（KMP 共享模块）：缓存 Gradle 用户目录，
      # 加速下面的 host 测试；deploy-* 的 flutter build 内复合构建同样复用。
      - name: Cache Gradle (native build)
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-native-${{ runner.os }}-${{ hashFiles('native/**/*.kts', 'native/**/*.toml', 'native/gradle/wrapper/*', 'native/gradlew', 'native/gradlew.bat') }}
          restore-keys: gradle-native-${{ runner.os }}-

      - name: Merge ARB fragments
        run: dart scripts/l10n/arb_tools.dart merge

      - name: Bootstrap generated sources
        run: dart run scripts/contract/bootstrap.dart --skip-client

      # generated/lucent_api 是独立 package：根 build_runner 不会替它生成各 model 的
      # part 文件（`part '*.g.dart'`，且 *.g.dart 被 gitignore）。
      # 缺这一步 analyze / test 都会在编译期失败。
      - name: Build generated API client
        run: |
          cd generated/lucent_api
          dart pub get
          dart run build_runner build --delete-conflicting-outputs
          cd ../..

      - name: Verify generated docs
        run: dart run scripts/docs/generate.dart --check

      # 根 `pub get` 不会为 path 依赖的子 package 各自解析依赖，而 `flutter analyze`
      # 会分析到 pkgs/ 下的源码。`pkgs/luminous_native_bridge/pigeon/steps.dart`
      # 引用了只在其 dev_dependencies 里的 pigeon，缺解析就会以
      # `Target of URI doesn't exist: 'package:pigeon/pigeon.dart'` 失败。
      # 全新 clone 上没有子包的 .dart_tool，本地能过是之前手动跑过 pub get。
      - name: Resolve sub-package dependencies
        run: |
          for pkg in pkgs/luminous_native_bridge pkgs/paddle_ocr_native-0.1.1; do
            echo "::group::pub get $pkg"
            (cd "$pkg" && flutter pub get)
            echo "::endgroup::"
          done

      - name: Analyze
        run: flutter analyze

      # 严格 Clean 分层门禁（R1–R9，无白名单）。
      # 架构清理期间（plans/2026-10-21-ddd-refactor-frontend.md）本条预期为红：
      # 用 continue-on-error 让 CI 可见违规数但不阻断合并；pre-push 与
      # scripts/workflows/daily.dart 跑同一条命令且不带 continue-on-error，
      # 本地推送与日常检查是真门禁。
      - name: Clean Architecture violations
        continue-on-error: true
        run: |
          cd tool/luminous_lints
          dart pub get
          dart run bin/luminous_lints.dart --clean-layers --quiet

      - name: Run tests
        run: flutter test --coverage --reporter=github

      # KMP 共享模块（native/luminous-native）的 commonTest 跑在 JVM 上，
      # 与 flutter test 是两条工具链；androidLibrary 目标随项目配置，
      # ubuntu runner 自带 Android SDK（ANDROID_HOME）。
      # 用 `bash gradlew` 而非 `./gradlew`：wrapper 脚本的可执行位在 Windows 上
      # 提交时（core.fileMode=false）会丢成 100644，Linux 上直接执行报 exit 126。
      - name: Run KMP host tests
        run: |
          cd native
          bash gradlew :luminous-native:testAndroidHostTest
