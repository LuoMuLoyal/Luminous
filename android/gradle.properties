org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Work around Windows cross-drive Kotlin incremental cache failures when the
# Flutter repo and Pub cache live on different drive roots.
kotlin.incremental=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# App module does not apply KGP (built-in Kotlin not needed); keep template default.
# AGP 9.1 + builtInKotlin=true caused Flutter Gradle plugin NPE (new-DSL only path).
android.builtInKotlin=false
